services:
  - type: web
    name: lumber-fishery-empire-tycoon
    env: node
    plan: free
    region: singapore # hoặc oregon, frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_NAME
        value: lumber_tycoon
      - key: MONGODB_URI
        sync: false # Người dùng tự nhập chuỗi kết nối Atlas trên dashboard Render

